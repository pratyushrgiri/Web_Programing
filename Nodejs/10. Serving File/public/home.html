<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Home</title>
	<style>
		:root {
			--bg: #f4f7fb;
			--card: #ffffff;
			--text: #1e293b;
			--muted: #64748b;
			--accent: #0ea5e9;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: linear-gradient(135deg, #e0f2fe, var(--bg));
			color: var(--text);
			padding: 1rem;
		}

		.card {
			width: min(560px, 100%);
			background: var(--card);
			border-radius: 12px;
			box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
			padding: 2rem;
			text-align: center;
		}

		h1 {
			margin-bottom: 0.75rem;
		}

		p {
			color: var(--muted);
			margin-bottom: 1.5rem;
			line-height: 1.6;
		}

		a {
			display: inline-block;
			text-decoration: none;
			background: var(--accent);
			color: white;
			padding: 0.6rem 1rem;
			border-radius: 8px;
			font-weight: 600;
		}

		a:hover {
			opacity: 0.9;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Welcome to Home Page</h1>
		<p>This is a simple Node.js static home page. Click below to learn more about us.</p>
		<a href="/about">Go to About Page</a>
	</main>
</body>
</html>
