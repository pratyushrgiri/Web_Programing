<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyNest</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="app-shell">
      <section id="authView" class="card panel active fade-in">
        <h1>StudyNest</h1>
        <p class="subtitle">A minimal educational workspace.</p>

        <div class="auth-switch">
          <button class="tab-btn active" data-tab="login">Login</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <form id="loginForm" class="auth-form active">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required />
          <label>Password</label>
          <input type="password" placeholder="••••••••" required />
          <label>User Type</label>
          <select id="loginRole" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Administrator</option>
          </select>
          <button type="submit">Enter StudyNest</button>
        </form>

        <form id="registerForm" class="auth-form">
          <label>Full Name</label>
          <input id="nameInput" type="text" placeholder="Your name" required />
          <label>Email</label>
          <input type="email" placeholder="you@example.com" required />
          <label>Password</label>
          <input type="password" placeholder="Create password" required />
          <label>Semester</label>
          <input type="text" placeholder="e.g. 4th" required />
          <label>Birth Date</label>
          <input type="date" required />
          <label>User Type</label>
          <select id="registerRole" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Administrator</option>
          </select>
          <button type="submit">Create Account</button>
        </form>
      </section>

      <section id="dashboardView" class="dashboard fade-in">
        <aside class="sidebar card">
          <h2>StudyNest</h2>
          <p id="userMeta">Welcome</p>
          <nav id="navLinks"></nav>
          <button id="logoutBtn" class="ghost">Logout</button>
        </aside>

        <section class="content-area">
          <header class="topbar card">
            <h3 id="welcomeTitle">Dashboard</h3>
            <span id="rolePill" class="pill"></span>
          </header>

          <section id="cardsGrid" class="grid"></section>
          <section id="sectionContent" class="card section-content"></section>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
